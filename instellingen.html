<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f0f2f5" />
  <title>Slaap Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <div class="header-title-box" data-i18n="page_instellingen">Instellingen</div>
    </div>
    <button class="lang-btn" id="langToggle">EN</button>
  </header>

  <main>

    <!-- Over deze App -->
    <div class="card">
      <div class="inst-over-row">
        <div class="inst-moon">🌙</div>
        <div class="label-box" data-i18n="lbl_over_app">Over deze App</div>
      </div>
      <div class="inst-sub-label" data-i18n="lbl_app_desc">Simpele slaap tracker</div>
    </div>

    <!-- Doel Slaap -->
    <div class="card">
      <div class="field-label-box" data-i18n="lbl_doel_slaap">Doel Slaap</div>
      <div class="doel-row">
        <input type="number" id="doelUren" class="input-doel" min="1" max="16" value="8" />
        <span class="label-box" data-i18n="lbl_uren_per_nacht">uren per nacht</span>
      </div>
      <button class="btn-doel-opslaan" id="saveDoelBtn" data-i18n="btn_opslaan_doel">Opslaan</button>
    </div>

    <!-- Herinnering -->
    <div class="card">
      <div class="field-label-box" data-i18n="lbl_herinnering">Herinnering</div>
      <div class="reminder-row">
        <input type="checkbox" id="reminderCheck" class="reminder-check" />
        <label for="reminderCheck" class="label-box" data-i18n="lbl_dag_herinnering">Dagelijkse herinnering</label>
      </div>
      <div class="input-card" style="margin-top: 10px;">
        <input type="time" id="reminderTime" class="input-bare" value="22:00" />
      </div>
    </div>

    <!-- Verwijder Alle Gegevens -->
    <div class="card">
      <button class="btn-verwijder" id="verwijderBtn" data-i18n="btn_verwijder_alles">Verwijder Alle Gegevens</button>
    </div>

  </main>

  <footer class="app-footer" data-i18n="footer_text">SlaapTracker v1.0</footer>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-tab">
      <div class="nav-square"></div>
      <span data-i18n="nav_index">Index</span>
    </a>
    <a href="invoer.html" class="nav-tab">
      <div class="nav-square"></div>
      <span data-i18n="nav_invoer">Invoer</span>
    </a>
    <a href="overzicht.html" class="nav-tab">
      <div class="nav-square"></div>
      <span data-i18n="nav_overzicht">Overzicht</span>
    </a>
    <a href="instellingen.html" class="nav-tab active">
      <div class="nav-square filled"></div>
      <span data-i18n="nav_instellingen">Instellingen</span>
    </a>
  </nav>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/instellingen.js"></script>
</body>
</html>
