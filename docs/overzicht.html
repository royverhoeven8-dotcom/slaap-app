<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f0f2f5" />
  <title>Slaap Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <div class="header-title-box" data-i18n="page_overzicht">Overzicht</div>
    </div>
    <button class="lang-btn" id="langToggle">EN</button>
  </header>

  <main>

    <!-- Totaal Nachten -->
    <div class="card row-start">
      <span class="label-box" data-i18n="lbl_totaal_nachten">Totaal Nachten</span>
      <div class="big-value" id="totaalNachten">0</div>
    </div>

    <!-- Gemiddeld -->
    <div class="card row-start">
      <span class="label-box" data-i18n="lbl_gemiddeld">Gemiddeld</span>
      <div class="big-value" id="gemiddeldUren">–</div>
    </div>

    <!-- Kwaliteit Verdeling -->
    <div class="card">
      <div class="section-label-box inline" data-i18n="lbl_kwal_verdeling">Kwaliteit Verdeling</div>
      <div id="kwalVerdeling" class="verdeling-list"></div>
    </div>

    <!-- Alle Nachten -->
    <div class="card">
      <div class="section-label-box inline" data-i18n="lbl_alle_nachten">Alle Nachten</div>
      <div id="alleNachten" class="inner-list"></div>
    </div>

  </main>

  <footer class="app-footer" data-i18n="footer_text">SlaapTracker v1.0</footer>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-tab">
      <div class="nav-square"></div>
      <span data-i18n="nav_index">Index</span>
    </a>
    <a href="invoer.html" class="nav-tab">
      <div class="nav-square"></div>
      <span data-i18n="nav_invoer">Invoer</span>
    </a>
    <a href="overzicht.html" class="nav-tab active">
      <div class="nav-square filled"></div>
      <span data-i18n="nav_overzicht">Overzicht</span>
    </a>
    <a href="instellingen.html" class="nav-tab">
      <div class="nav-square"></div>
      <span data-i18n="nav_instellingen">Instellingen</span>
    </a>
  </nav>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/overzicht.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
