<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f0f2f5" />
  <meta name="description" content="SlaapTracker – bijhoud je slaap" />
  <title>Slaap Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <div class="header-icon">🌙</div>
      <div class="header-title-box" data-i18n="app_title">Slaap Tracker</div>
    </div>
    <button class="lang-btn" id="langToggle">EN</button>
  </header>

  <main>

    <!-- Gemiddelde Slaap card -->
    <div class="card row-center">
      <span class="label-box" data-i18n="lbl_gem_slaap">Gemiddelde Slaap</span>
      <div class="big-value" id="avgSleep">–</div>
      <span class="label-box" data-i18n="lbl_per_nacht">per nacht</span>
    </div>

    <!-- Laatste Nacht card -->
    <div class="card">
      <div class="laatste-top">
        <span class="label-box" data-i18n="lbl_laatste_nacht">Laatste Nacht</span>
        <div class="mid-value" id="lastUren">–</div>
      </div>
      <div class="laatste-bottom">
        <span class="datum-box" id="lastDatum">–</span>
        <span class="kwal-box" id="lastKwal">–</span>
      </div>
    </div>

    <!-- Recente Nachten -->
    <div class="section-label-box" data-i18n="lbl_recente_nachten">Recente Nachten</div>
    <div id="recentList"></div>

  </main>

  <footer class="app-footer" data-i18n="footer_text">SlaapTracker v1.0</footer>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-tab active">
      <div class="nav-square filled"></div>
      <span data-i18n="nav_index">Index</span>
    </a>
    <a href="invoer.html" class="nav-tab">
      <div class="nav-square"></div>
      <span data-i18n="nav_invoer">Invoer</span>
    </a>
    <a href="overzicht.html" class="nav-tab">
      <div class="nav-square"></div>
      <span data-i18n="nav_overzicht">Overzicht</span>
    </a>
    <a href="instellingen.html" class="nav-tab">
      <div class="nav-square"></div>
      <span data-i18n="nav_instellingen">Instellingen</span>
    </a>
  </nav>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/index.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
